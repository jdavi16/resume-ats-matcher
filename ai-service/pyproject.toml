[project]
name = "ai-service"
version = "0.1.0"
description = "FastAPI microservice for AI recruitment analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "fastapi[standard]>=0.115.0",
    "google-genai>=0.1.1",
    "pydantic>=2.10.0",
    "dotenv>=0.9.9",
    "google>=3.0.0",
    "uvicorn>=0.52.0",
    "black>=26.5.1",
]

[tool.uv]
# Clears out complex local loops to keep the microservice environment simple and lightweight
